server:
  port: 8082

spring:
  application:
    name: food-service
  data:
    mongodb:
      uri: mongodb://localhost:27017/foodiehub_food
      auto-index-creation: true
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  elasticsearch:
    uris: http://localhost:9200

management:
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
