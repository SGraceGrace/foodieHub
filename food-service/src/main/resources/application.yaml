server:
  port: ${PORT:8082}

spring:
  application:
    name: food-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/foodiehub_food}
      auto-index-creation: true
  rabbitmq:
    addresses: ${RABBITMQ_URL:amqp://guest:guest@localhost:5672}
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:0.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
