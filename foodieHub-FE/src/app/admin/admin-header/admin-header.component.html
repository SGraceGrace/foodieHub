<header class="admin-header">
  <div class="logo-area">
    <div class="logo-icon">F</div>
    <div>
      <div class="logo-text">foodiehub</div>
      <div class="logo-sub">Admin Portal</div>
    </div>
  </div>

  <div class="header-right">

    <!-- Notification Bell -->
    <div class="notif-wrapper" (click)="toggleDropdown($event)">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>

      <!-- Dropdown -->
      <div class="notif-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <span class="notif-title">Today's Notifications</span>
          <span class="notif-count">{{ notifications.length }}</span>
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0; else empty">
          <div class="notif-item" *ngFor="let n of notifications" [class.activity]="n.type === 'ACTIVITY'" [class.pending]="n.type === 'PENDING_OWNER'" (click)="openNotification(n)">
            <div class="notif-icon">
              <span *ngIf="n.type === 'PENDING_OWNER'">🏪</span>
              <span *ngIf="n.type === 'ACTIVITY'">📋</span>
            </div>
            <div class="notif-body">
              <p class="notif-msg">{{ n.message }}</p>
              <div class="notif-meta">
                <span class="notif-actor" *ngIf="n.actorEmail">by {{ n.actorEmail }}</span>
                <span class="notif-time">{{ formatTime(n.timestamp) }}</span>
              </div>
            </div>
          </div>
        </div>

        <ng-template #empty>
          <div class="notif-empty">No activity today</div>
        </ng-template>
      </div>
    </div>

    <div class="user-icon" (click)="logout()" title="Logout">AD</div>
  </div>
</header>
