<header class="admin-header">
  <div class="logo-area">
    <div class="logo-icon">F</div>
    <div>
      <div class="logo-text">foodiehub</div>
      <div class="logo-sub">Admin Portal</div>
    </div>
  </div>

  <div class="header-right">

    <!-- Enable push notifications button (only shown when not yet granted) -->
    <button
      *ngIf="pushSupported && pushPermission !== 'granted'"
      class="push-enable-btn"
      (click)="enablePushNotifications()"
      title="Enable browser push notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      Enable Notifications
    </button>

    <!-- Notification Bell -->
    <div class="notif-wrapper" (click)="toggleDropdown($event)">
      <svg class="bell-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
        <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
      </svg>
      <span class="badge" *ngIf="unreadCount > 0">{{ unreadCount > 9 ? '9+' : unreadCount }}</span>

      <!-- Dropdown -->
      <div class="notif-dropdown" *ngIf="showDropdown" (click)="$event.stopPropagation()">
        <div class="notif-header">
          <span class="notif-title">Today's Notifications</span>
          <div class="notif-header-right">
            <span class="notif-count">{{ notifications.length }}</span>
            <button
              class="clear-all-btn"
              *ngIf="notifications.length > 0"
              (click)="clearAll($event)"
              title="Clear all notifications">
              Clear all
            </button>
          </div>
        </div>

        <div class="notif-list" *ngIf="notifications.length > 0; else empty">
          <div class="notif-item"
               *ngFor="let n of notifications"
               [class.pending]="notifClass(n) === 'pending'"
               [class.activity]="notifClass(n) === 'activity'"
               (click)="openNotification(n)">
            <div class="notif-icon">{{ notifIcon(n) }}</div>
            <div class="notif-body">
              <p class="notif-msg">{{ n.message }}</p>
              <div class="notif-meta">
                <span class="notif-actor" *ngIf="n.actorEmail">by {{ n.actorEmail }}</span>
                <span class="notif-time">{{ formatTime(n.timestamp) }}</span>
              </div>
            </div>
            <button class="dismiss-btn" (click)="dismiss(n, $event)" title="Dismiss">✕</button>
          </div>
        </div>

        <ng-template #empty>
          <div class="notif-empty">No activity today</div>
        </ng-template>
      </div>
    </div>

    <div class="user-icon" (click)="logout()" title="Logout">AD</div>
  </div>
</header>
