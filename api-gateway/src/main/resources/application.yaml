spring:
  application:
    name: api-gateway
  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service-auth
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/auth/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-users
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/user, /api/v1/user/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-refresh
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/refresh-token/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-oauth2
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/oauth2/**, /login/oauth2/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service-oauth2
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-contact
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/contact
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-admin-contact-messages
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/admin/contact-messages, /api/v1/admin/contact-messages/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: food-service-slides-public
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/slides
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-slides-admin
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/admin/slides, /api/v1/admin/slides/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-admin-restaurants
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/admin/restaurants, /api/v1/admin/restaurants/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: user-service-admin-users
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/admin/users, /api/v1/admin/users/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-activity-logs
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/admin/activity-logs
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-restaurant-owners
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/admin/restaurant-owners, /api/v1/admin/restaurant-owners/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: user-service-drivers
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/admin/drivers, /api/v1/admin/drivers/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: notification-service-notifications
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/admin/notifications, /api/v1/admin/notifications/**
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
                  fallbackUri: forward:/fallback/notification-service

          - id: notification-service-push-subscription
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/admin/push-subscription
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
                  fallbackUri: forward:/fallback/notification-service

          - id: user-service-partner
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/partner/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: notification-service-driver-notifications
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/driver/notifications, /api/v1/driver/notifications/**
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
