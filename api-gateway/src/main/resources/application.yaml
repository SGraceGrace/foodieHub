spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webmvc:
          routes:
          - id: user-service-auth
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/auth/**

          - id: user-service-users
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/user, /api/v1/user/**

          - id: user-service-refresh
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/refresh-token/**

          - id: user-service-oauth2
            uri: http://localhost:8081
            predicates:
              - Path=/oauth2/**, /login/oauth2/**

          - id: user-service-contact
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/contact

          - id: user-service-slides-public
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/slides

          - id: user-service-slides-admin
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/admin/slides, /api/v1/admin/slides/**

          - id: user-service-admin-users
            uri: http://localhost:8081
            predicates:
              - Path=/api/v1/admin/users, /api/v1/admin/users/**

          - id: food-service-restaurants
            uri: http://localhost:8082
            predicates:
              - Path=/api/v1/restaurants, /api/v1/restaurants/**

          - id: food-service-cuisines
            uri: http://localhost:8082
            predicates:
              - Path=/api/cuisines/**

          - id: food-service-search
            uri: http://localhost:8082
            predicates:
              - Path=/api/search/**

          - id: order-service-cart
            uri: http://localhost:8083
            predicates:
              - Path=/api/cart/**

          - id: order-service-orders
            uri: http://localhost:8083
            predicates:
              - Path=/api/orders/**


server:
  port: 8080

jwt:
  secret:
    key: ${JWT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
