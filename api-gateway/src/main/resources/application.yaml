          - id: notification-service-driver-push-subscription
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/driver/push-subscription
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
                  fallbackUri: forward:/fallback/notification-service

          - id: user-service-driver-register
            uri: ${USER_SERVICE_URL:http://localhost:8081}
            predicates:
              - Path=/api/v1/driver/**
            filters:
              - name: CircuitBreaker
                args:
                  id: user-service
                  fallbackUri: forward:/fallback/user-service

          - id: food-service-wishlist
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/wishlist, /api/v1/wishlist/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-ratings
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/ratings, /api/v1/ratings/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-restaurants
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/v1/restaurants, /api/v1/restaurants/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-cuisines
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/cuisines/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: food-service-search
            uri: ${FOOD_SERVICE_URL:http://localhost:8082}
            predicates:
              - Path=/api/search/**
            filters:
              - name: CircuitBreaker
                args:
                  id: food-service
                  fallbackUri: forward:/fallback/food-service

          - id: order-service-cart
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/cart/**
            filters:
              - name: CircuitBreaker
                args:
                  id: order-service
                  fallbackUri: forward:/fallback/order-service

          - id: order-service-orders
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/orders/**
            filters:
              - name: CircuitBreaker
                args:
                  id: order-service
                  fallbackUri: forward:/fallback/order-service

          - id: order-service-payments
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/payments/**
            filters:
              - name: CircuitBreaker
                args:
                  id: order-service
                  fallbackUri: forward:/fallback/order-service

          - id: order-service-coupons
            uri: ${ORDER_SERVICE_URL:http://localhost:8083}
            predicates:
              - Path=/api/v1/coupons/**, /api/v1/admin/coupons, /api/v1/admin/coupons/**
            filters:
              - name: CircuitBreaker
                args:
                  id: order-service
                  fallbackUri: forward:/fallback/order-service

          - id: notification-service-restaurant
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/restaurant/notifications, /api/v1/restaurant/notifications/**
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
                  fallbackUri: forward:/fallback/notification-service

          - id: notification-service-customer-sse
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/customer/notifications/stream
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service-sse
                  fallbackUri: forward:/fallback/notification-service

          - id: notification-service-customer
            uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8084}
            predicates:
              - Path=/api/v1/customer/notifications, /api/v1/customer/notifications/**, /api/v1/customer/push-subscription
            filters:
              - name: CircuitBreaker
                args:
                  id: notification-service
                  fallbackUri: forward:/fallback/notification-service


server:
  port: ${PORT:8080}

jwt:
  secret:
    key: ${JWT_KEY}

resilience4j:
  circuitbreaker:
    instances:
      user-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      food-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      order-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      notification-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true
      notification-service-sse:
        sliding-window-size: 10
        failure-rate-threshold: 100
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 1
        register-health-indicator: true
      user-service-oauth2:
        sliding-window-size: 5
        failure-rate-threshold: 80
        wait-duration-in-open-state: 5s
        permitted-number-of-calls-in-half-open-state: 2
        register-health-indicator: true

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411}/api/v2/spans

logging:
  level:
    org.springframework.security: DEBUG
