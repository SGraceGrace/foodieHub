spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      mvc:
        routes:
          - id: user-service
            uri: http://localhost:8081
            predicates:
              - Path=/api/auth/**, /api/users/**

          - id: food-service
            uri: http://localhost:8082
            predicates:
              - Path=/api/restaurants/**, /api/cuisines/**, /api/search/**

          - id: order-service
            uri: http://localhost:8083
            predicates:
              - Path=/api/cart/**, /api/orders/**

        globalcors:
          corsConfigurations:
            '[/**]':
              allowedOrigins:
                - "http://localhost:4200"
              allowedMethods:
                - GET
                - POST
                - PUT
                - DELETE
                - OPTIONS
              allowedHeaders:
                - "*"
              allowCredentials: true

server:
  port: 8080

jwt:
  secret:
    key: ${JWT_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: always
