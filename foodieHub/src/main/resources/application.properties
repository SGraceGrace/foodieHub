spring.application.name=foodieHub
spring.datasource.url=jdbc:mysql://localhost:3306/foodiehub
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

jwt.secret.key=${JWT_KEY}
jwt.token.expiration=${JWT_EXPIRATION}
refresh.token.expiration=${REFRESH_TOKEN_EXPIRATION}

spring.cache.type=redis
spring.data.redis.port=6379
spring.data.redis.host=127.0.0.1

spring.security.oauth2.client.registration.google.client-id=${GOOGLE-CLIENT-ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE-SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo